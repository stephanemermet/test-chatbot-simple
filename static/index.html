<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Chatbot</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%236366f1'/><circle cx='11' cy='15' r='2.4' fill='white'/><circle cx='21' cy='15' r='2.4' fill='white'/><path d='M10 21c3 2.4 9 2.4 12 0' stroke='white' stroke-width='2' fill='none' stroke-linecap='round'/></svg>">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i></div>
<main class="app">
  <header class="top">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 32 32" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="14" r="1.2" fill="currentColor"/><circle cx="21" cy="14" r="1.2" fill="currentColor"/><path d="M10 20c3 2.4 9 2.4 12 0"/></svg>
      </div>
      <div>
        <h1>Chatbot</h1>
        <p class="status"><span class="pulse"></span><span id="model">connexion…</span></p>
      </div>
    </div>
    <button id="reset" class="ghost" type="button">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      Nouveau
    </button>
  </header>

  <section id="chat" class="chat" aria-live="polite">
    <div class="welcome" id="welcome">
      <div class="hero-logo">
        <svg viewBox="0 0 32 32" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="14" r="1.3" fill="currentColor"/><circle cx="21" cy="14" r="1.3" fill="currentColor"/><path d="M10 20c3 2.4 9 2.4 12 0"/></svg>
      </div>
      <h2>Comment puis-je vous aider ?</h2>
      <p>Posez une question, demandez du code ou une idée.</p>
      <div class="chips">
        <button type="button" class="chip">Explique-moi l’informatique quantique simplement</button>
        <button type="button" class="chip">Écris une fonction Python pour trier un dictionnaire</button>
        <button type="button" class="chip">Donne-moi 3 idées de repas rapides</button>
      </div>
    </div>
  </section>

  <form id="form" class="composer">
    <textarea id="input" rows="1" placeholder="Écrivez votre message…" autofocus></textarea>
    <button type="submit" id="send" aria-label="Envoyer">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </form>
  <p class="hint">Entrée pour envoyer · Maj+Entrée pour un retour à la ligne</p>
</main>
<script src="/app.js"></script>
</body>
</html>
